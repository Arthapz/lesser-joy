name: upload
description: Upload artifacts

inputs:
  name:
    required: true

runs:
  using: composite
  steps:
    - name: Installation
      run: mkdir '${{ runner.workspace }}/output'; xmake package -o '${{ runner.workspace }}/output'
      shell: bash

    - name: Upload artifacts
      id: upload
      uses: actions/upload-artifact@v7
      with:
        path: ${{ runner.workspace }}/output
        name: ${{ inputs.name }}
