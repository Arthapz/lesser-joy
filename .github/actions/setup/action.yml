name: setup
description: Checkout, install compiler and fetch environment infos

inputs:
  os:
    required: true
  arch:
    required: true
  compiler:
    required: true
  llvm_version:
    required: false

runs:
  using: composite
  steps:
    - name: Use current date as xmake package cache key
      id: cache_key
      run: echo "key=$(date +'%W')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Configure Pagefile
      if: ${{ inputs.os == 'windows' }}
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 32GB
        disk-root: "D:"

    - name: Install compilers
      uses: ./.github/actions/install-compilers
      with:
        os: ${{ inputs.os }}
        arch: ${{ inputs.arch }}
        compiler: ${{ inputs.compiler }}
        llvm_version: ${{ inputs.llvm_version }}
    
    - name: Set XMake env
      run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> $GITHUB_ENV
      shell: bash

    - name: Setup XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: Arthapz/xmake#branch@future_prs
        actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

    - name: Update xmake repository
      run: xmake repo --update
      shell: bash

    - name: Retrieve dependencies hash
      id: dep_hash
      run: echo "hash=$(xmake l utils.ci.packageskey)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Restore cached NuGet packages
      id: restore-nugetcache
      if: ${{ inputs.os == 'windows' }}
      uses: actions/cache/restore@v6
      with:
        path: '${{ runner.workspace }}/packages'
        key: ${{ inputs.os }}-${{ inputs.arch }}

    - name: Setup NuGet
      if: ${{ inputs.os == 'windows' && !steps.restore-nugetcache.outputs.cache-hit }}
      uses: NuGet/setup-nuget@v1
    
    - name: Restore NuGet packages 
      if: ${{ inputs.os == 'windows' && !steps.restore-nugetcache.outputs.cache-hit }}
      run: nuget restore '${{ runner.workspace }}/lesser-joy/packages.config' -PackagesDirectory '${{ runner.workspace }}/packages/'
      shell: bash

    - run: cp '${{ runner.workspace }}/packages/Microsoft.Windows.WDK.x64.10.0.26100.4204/c/Include/10.0.26100.0/km/hidport.h' '${{ runner.workspace }}/packages/Microsoft.Windows.WDK.x64.10.0.26100.4204/c/Include/10.0.26100.0/um/'
      if: ${{ inputs.os == 'windows' && !steps.restore-nugetcache.outputs.cache-hit }}
      shell: bash

    - name: Cache NuGet packages
      if: ${{ inputs.os == 'windows' && !steps.restore-nugetcache.outputs.cache-hit }}
      uses: actions/cache/save@v6
      with:
        path: '${{ runner.workspace }}/packages'
        key: ${{ steps.restore-nugetcache.outputs.cache-primary-key }}

outputs:
  dep_hash:
    value: ${{ steps.dep_hash.outputs.hash }}
  cache_key:
    value: ${{ steps.cache_key.outputs.key }}
